name: 'Setup iOS Demo Codesigning'
description: 'Import the Appium signing cert and install the In House provisioning profiles for the OneSignal demo app (main target, NSE, Live Activity widget). Call once per iOS build job in an SDK E2E workflow. Targets the OneSignal, Inc. Enterprise team (DL8TF3X4K3), which has no App Store Connect API, so the profiles come from secrets.'

inputs:
  p12-base64:
    description: 'Base64-encoded .p12 of the in-house "iPhone Distribution" certificate'
    required: true
  p12-password:
    description: 'Password used when exporting the .p12'
    required: true
  main-profile-base64:
    description: 'Base64-encoded "Appium Demo - Main" .mobileprovision'
    required: true
  nse-profile-base64:
    description: 'Base64-encoded "Appium Demo - NSE" .mobileprovision'
    required: true
  widget-profile-base64:
    description: 'Base64-encoded "Appium Demo - Live Activity" .mobileprovision'
    required: true
  team-id:
    description: 'Apple team the profiles must belong to'
    required: false
    default: 'DL8TF3X4K3'

runs:
  using: composite
  steps:
    - name: Import signing certificate
      uses: apple-actions/import-codesign-certs@v7
      with:
        p12-file-base64: ${{ inputs.p12-base64 }}
        p12-password: ${{ inputs.p12-password }}
        keychain-password: ci-keychain

    - name: Install provisioning profiles
      shell: bash
      env:
        MAIN_PROFILE: ${{ inputs.main-profile-base64 }}
        NSE_PROFILE: ${{ inputs.nse-profile-base64 }}
        WIDGET_PROFILE: ${{ inputs.widget-profile-base64 }}
        TEAM_ID: ${{ inputs.team-id }}
      run: |
        set -euo pipefail
        dest="$HOME/Library/MobileDevice/Provisioning Profiles"
        mkdir -p "$dest"
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT

        install_profile() {
          local label=$1 expected_name=$2 data=$3
          if [ -z "$data" ]; then
            echo "::error::$label profile secret is empty; set APPIUM_IOS_PROFILE_*_BASE64"
            exit 1
          fi
          printf '%s' "$data" | base64 --decode > "$tmp/$label.mobileprovision"
          security cms -D -i "$tmp/$label.mobileprovision" > "$tmp/$label.plist"

          local uuid name team expires
          uuid=$(plutil -extract UUID raw "$tmp/$label.plist")
          name=$(plutil -extract Name raw "$tmp/$label.plist")
          team=$(plutil -extract TeamIdentifier.0 raw "$tmp/$label.plist")
          expires=$(plutil -extract ExpirationDate raw "$tmp/$label.plist")

          if [ "$name" != "$expected_name" ]; then
            echo "::error::$label profile is \"$name\", expected \"$expected_name\""
            exit 1
          fi
          if [ "$team" != "$TEAM_ID" ]; then
            echo "::error::$label profile belongs to team $team, expected $TEAM_ID"
            exit 1
          fi

          local expires_epoch now days_left
          expires_epoch=$(date -j -u -f '%Y-%m-%dT%H:%M:%SZ' "$expires" +%s)
          now=$(date -u +%s)
          days_left=$(( (expires_epoch - now) / 86400 ))
          if [ "$days_left" -lt 0 ]; then
            echo "::error::\"$name\" expired on $expires; regenerate it and update the secret"
            exit 1
          elif [ "$days_left" -lt 30 ]; then
            echo "::warning::\"$name\" expires in $days_left days ($expires)"
          fi

          cp "$tmp/$label.mobileprovision" "$dest/$uuid.mobileprovision"
          echo "Installed \"$name\" ($uuid), expires $expires"
        }

        install_profile main 'Appium Demo - Main' "$MAIN_PROFILE"
        install_profile nse 'Appium Demo - NSE' "$NSE_PROFILE"
        install_profile widget 'Appium Demo - Live Activity' "$WIDGET_PROFILE"
